name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai thu vien
        run: npm install

      - name: Chuan bi file web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Tao project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Doi icon app
        run: find android/app/src/main/res -name 'ic_launcher*.png' -exec cp icon-512.png {} \;

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Doi ten file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GBA-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GBA-Player-apk
          path: GBA-Player.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GBA Player (ban ${{ github.run_number }})
          files: GBA-Player.apk
